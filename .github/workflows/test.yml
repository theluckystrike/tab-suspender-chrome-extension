name: test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/background.js && node -e "JSON.parse(require('fs').readFileSync('src/manifest.json','utf8'))"
